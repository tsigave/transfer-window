[workspace]
resolver = "2"
members = [
  "crates/sim-time",
  "crates/sim-astro",
  "crates/sim-app",
  "crates/sim-save",
  "crates/sim-tools",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tsigave/transfer-window"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
tempfile = "3.12"
thiserror = "2.0"
