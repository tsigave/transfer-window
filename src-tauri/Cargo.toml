[package]
name = "solarstorm-desktop"
version = "0.1.0"
description = "Solarstorm alpha-v0.1 desktop boundary"
authors = ["Solarstorm contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "solarstorm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
sim-app = { path = "../crates/sim-app" }
sim-astro = { path = "../crates/sim-astro" }
sim-save = { path = "../crates/sim-save" }
sim-time = { path = "../crates/sim-time" }

