[package]
name = "transfer-window-desktop"
version = "0.2.2"
description = "Transfer Window alpha-v0.2 desktop boundary"
authors = ["Transfer Window contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "transfer_window_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
sim-app = { path = "../crates/sim-app" }
sim-astro = { path = "../crates/sim-astro" }
sim-engineering = { path = "../crates/sim-engineering" }
sim-save = { path = "../crates/sim-save" }
sim-time = { path = "../crates/sim-time" }
sim-trajectory = { path = "../crates/sim-trajectory" }
